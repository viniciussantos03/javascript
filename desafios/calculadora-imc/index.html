<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora IMC</title>
    <link rel="stylesheet" href="estilo/style.css">
</head>
<body>
    <main>
        <div id="div-dados">
            <h1>Calculando IMC (Índice de Massa Corporal)</h1>
            <form id="dados-calc">
                <div class="calculadora-imc">
                    <label for="nome">Nome:</label>
                    <input type="text" name="inome" id="nome" required>
                    <label for="idade">Idade:</label>
                    <input type="number" name="iidade" id="idade" required>
                    <label for="peso">Peso:</label>
                    <input type="number" name="ipeso" id="peso" required>
                    <label for="altura">Altura:</label>
                    <input type="number" name="ialtura" id="altura" placeholder="coloque número decimal, ex: 1.21" step="0.01" required>
                </div>
                <div class="enviar">
                    <button type="submit" id="botao">Enviar dados</button>
                </div>
            </form>
        </div>
        <div id="resultado">
            <p class="texto"></p>
        </div>
    </main>
    <script src="script/script.js"></script>
</body>
</html>
