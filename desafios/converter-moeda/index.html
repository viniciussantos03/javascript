<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conversor de Moeda</title>
    <link rel="stylesheet" href="estilo/style.css">
</head>
<body>
    <main>
        <div id="div-moedas">
            <h1>Converta de real para outra moeda</h1>
            <form>
                <span>
                    R$
                </span>
                <input type="number" name="inumero" id="numero">
                <select name="iescolha-moeda" id="escolha-moeda">
                    <option value="" selected disabled>Escolha uma moeda</option>
                    <option value="usd">Dólar</option>
                    <option value="eur">Euro</option>
                    <option value="gbp">Libra estrelina</option>
                    <option value="jpy">Iene</option>
                    <option value="cad">Dólar canadense</option>
                    <option value="aud">Dólar australiano</option>
                </select>
                <div id="conversao">
                    <button id="botao">Converter</button>
                </div>
            </form>
        </div>
        <div id="div-resultado">
            <p class="resultado hide"></p>
        </div>
    </main>

    <script src="script/script.js"></script>
</body>
</html>
