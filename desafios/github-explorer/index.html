<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Explorer</title>
    <link rel="stylesheet" href="estilos/style.css">
    <script src="https://kit.fontawesome.com/278760cac2.js" crossorigin="anonymous"></script>
    <script src="scripts/script.js" defer></script>
</head>
<body>
    <header>

        <div id="menu-container">

            <div class="mobile-tablet">

                    <div class="borda">
                        <a href="https://github.com/" target="_blank" rel="noopener noreferrer">
                            <i class="fa-brands fa-github"></i>
                        </a>
                    </div>

                <div class="user">

                    <i class="fa-regular fa-user"></i>

                </div>
            </div>

            <div class="pc hide">

                <a href="#">Sign in</a>
                <a href="#">Sign up</a>

            </div>

                <div id="botao-pesquisar" class="hide">
                    <input type="search" name="pesquisar" id="pesquisar" placeholder="Search">
                    <button type="button" aria-label="Pesquisar">
                        <i class="fa-solid fa-magnifying-glass"></i>
                    </button>
                </div>

            <div class="overlay hide">

            </div>
            
            <div class="div-menu hide">

                <nav>
                    <a href="#">Products</a>
                    <a href="#">Developers</a>
                    <a href="#">Businesses</a>
                    <a href="#">Resources</a>
                    <a href="#">Pricing</a>
                </nav>

            </div>

            <div class="menu-hamburguinho">

                <button id="menu-toggle" aria-label="Abrir menu" aria-expanded="false">
                    <i class="fa-solid fa-bars"></i>
                </button>

            </div>
        </div>

    </header>
</body>
</html>
