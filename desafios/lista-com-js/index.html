<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Tarefas</title>
    <link rel="stylesheet" href="estilo/style.css">
    <script src="https://kit.fontawesome.com/278760cac2.js" crossorigin="anonymous"></script>
</head>
<body>
    <main>
        <div id="lista-tarefas">
        <h1>Lista de Tarefas</h1>
            <form>
                <input type="text" name="itarefa" id="tarefa" placeholder="Digite suas tarefas">
                <button class="botao">
                    <i class="fa-solid fa-plus"></i>
                </button>
            </form>
        </div>

        <div id="secao-lista">
            <ul id="lista">
                <li class="lista-texto template hide">
                    <p class="texto"></p>
                        <div id="dif">
                            <i id="confere" class="fa-solid fa-check dif"></i>
                            <i id="remove" class="fa-solid fa-xmark dif"></i>
                        </div>
                </li>
            </ul>
        </div>
    </main>
    <script src="scripts/script.js"></script>
</body>
</html>
