<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Interativo</title>
    <link rel="stylesheet" href="estilos/style.css">
    <script src="https://kit.fontawesome.com/278760cac2.js" crossorigin="anonymous"></script>
    <script src="scripts/script.js" defer></script>
</head>
<body>
    <main>
        <div class="quiz-container">
            <div class="quiz">
                <h1>Teste de Conhecimentos Gerais</h1>
                <h2 id="perguntas"></h2>
                <div class="alternativas">
                    <button id="opcao1" class="opcoes"></button>
                    <button id="opcao2" class="opcoes"></button>
                    <button id="opcao3" class="opcoes"></button>
                    <button id="opcao4" class="opcoes"></button>
                </div>
                <div id="situacao" class="hide"></div>
                <div id="resposta" class="hide"></div>
                <button id="proximo">Próximo</button>
            </div>
        </div>

        <div class="resultado-container hide">
            <div class="resultado">
            <h3>Parabéns, você finalizou o quiz!</h3>
                <p id="acertos"></p>
                <p id="erros"></p>

                <p id="avaliacao"></p>
            </div>
        </div>
    </main>
</body>
</html>
