<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contador de caracteres e palavras</title>
    <link rel="stylesheet" href="estilos/style.css">
    <script src="scripts/script.js" defer></script>
</head>
<body>
    <div class="container">
        <h1>Contador de caracteres e palavras</h1>
        <div class="field">
            <label for="input">Digite o seu texto:</label>
            <textarea name="input" id="input" rows="5"></textarea>
        </div>
        <div class="counter">0 caracter(s)</div>
        <button id="toggle">Contar palavras</button>
    </div>
</body>
</html>
